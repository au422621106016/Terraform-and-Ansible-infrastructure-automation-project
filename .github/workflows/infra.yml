name: Terraform-Ansible

on:
 push:
  branches: 
   - main

jobs:
  deploy:
   runs-on: ubuntu-latest

   steps:
     - name: checkout
       uses: actions/checkout@v4

     - name: COnfigure AWS
       uses: aws-actions/configure-aws-credentials@v4
       with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

     - name: Create Public Key File
       working-directory: terraform
       run: |
          echo "${{ secrets.PUBLIC_KEY }}" > public_key.pub

     - name: Create terraform.tfvars
       working-directory: terraform
       run: |
         echo 'key_name = "${{ secrets.KEY_NAME }}"' > terraform.tfvars 
         echo 'public_key_path = "public_key.pub"' >> terraform.tfvars

     - name: Show tfvars
       working-directory: terraform 
       run: cat terraform.tfvars    
             

     - name: Setup Terraform  
       uses: hashicorp/setup-terraform@v3
   

     - name: Terraform Init
       working-directory: terraform
       run: terraform init

     - name: Terraform Validate
       working-directory: terraform
       run: terraform validate

     - name: Terraform Plan
       working-directory: terraform
       run: terraform plan -var-file="terraform.tfvars"  

     - name: Terraform Apply
       working-directory: terraform
       run: terraform apply --auto-approve -var-file="terraform.tfvars"  

     - name: Install Ansible
       run: |
         sudo apt update
         sudo apt install ansible -y

     - name: Update Inventory
       working-directory: .
       run: |
         echo "[web]" > ansible/inventory.ini
         echo "${{ secrets.EC2_HOST }}" >> ansible/inventory.ini 
         echo "" >> ansible/inventory.ini
         echo "[web:vars]" >> ansible/inventory.ini
         echo "ansible_user=ubuntu" >> ansible/inventory.ini

     - name: Create SSH Private Key
       run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa 
    
     - name: Run Ansible Playbook
       working-directory: .
       env: 
         ANSIBLE_HOST_KEY_CHECKING: "False"
       run: |
         ansible-playbook -i ansible/inventory.ini ansible/playbook.yml                         