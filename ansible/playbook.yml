---
- name: Configure EC2 and Deploy Application
  hosts: web
  become: yes

  tasks:
    - name: Install required dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present
        update_cache: yes

    - name: Install Docker using official script
      shell: curl -fsSL https://get.docker.com | sh  
    
    - name: Enable Docker service
      systemd:
         name: docker
         enabled: yes
         state: started    

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Restart Docker service
      service:
         name: docker
         state: restarted         

    - name: Clone GitHub repository
      git:
        repo: https://github.com/au422621106016/devops-task-platform.git
        dest: /home/ubuntu/app
        version: main

    - name: Create .env file
      copy:
        dest: /home/ubuntu/app/.env
        content: |
          MYSQL_HOST=mysql
          MYSQL_USER=root
          MYSQL_PASSWORD=rootpassword
          MYSQL_DATABASE=devopsdb
          JWT_SECRET_KEY=myjwtsecret

    - name: Run Docker containers
      shell: sudo docker compose up -d
      args:
       chdir: /home/ubuntu/app        

           